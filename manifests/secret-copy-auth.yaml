apiVersion: v1
kind: ServiceAccount
metadata:
  # The Job identity used by both Kubernetes Auth roles.
  name: secret-copy
  namespace: openbao
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # Kept as an explicit reviewer identity for Kubernetes Auth administration.
  name: vault-auth-reviewer
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-vault-auth-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Allows OpenBao to submit TokenReview requests to the Kubernetes API.
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth-reviewer
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-server-auth-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # OpenBao server ServiceAccounts use their own pod token for TokenReview.
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
  - kind: ServiceAccount
    name: openbao-destination
    namespace: openbao-destination
