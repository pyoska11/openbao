apiVersion: v1
kind: ServiceAccount
metadata:
  # The projected JWT from this identity is exchanged for short-lived
  # OpenBao tokens by the Job; no SecretID is stored in Kubernetes.
  name: secret-copy
  namespace: openbao
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-copy
  namespace: openbao
spec:
  # A failed copy must be visible and retried explicitly rather than silently
  # overwriting the destination with an unknown result.
  backoffLimit: 0
  # Keep logs available briefly for verification, then remove the Job.
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-copy
    spec:
      serviceAccountName: secret-copy
      # The token is mounted explicitly below with audience=vault.
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          # Reuse the OpenBao CLI image so the Job needs no custom image.
          image: quay.io/openbao/openbao:2.4.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The projected JWT is exchanged separately at source and
              # destination, producing tokens with different policies.
              jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              source_token="$(BAO_ADDR="$SOURCE_ADDR" bao write -field=token auth/kubernetes/login role=secret-copy-source jwt="$jwt")"
              destination_token="$(BAO_ADDR="$DESTINATION_ADDR" bao write -field=token auth/kubernetes/login role=secret-copy-destination jwt="$jwt")"
              # Read the source secret, write it to the destination, then verify it.
              source_value="$(BAO_ADDR="$SOURCE_ADDR" BAO_TOKEN="$source_token" bao kv get -field="$FIELD" "secret/$SOURCE_PATH")"
              BAO_ADDR="$DESTINATION_ADDR" BAO_TOKEN="$destination_token" bao kv put "secret/$DESTINATION_PATH" "$FIELD=$source_value"
              destination_value="$(BAO_ADDR="$DESTINATION_ADDR" BAO_TOKEN="$destination_token" bao kv get -field="$FIELD" "secret/$DESTINATION_PATH")"
              [ "$source_value" = "$destination_value" ]
              echo "secret copy and verification passed"
          env:
            - name: SOURCE_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
            - name: DESTINATION_ADDR
              value: http://openbao-destination.openbao-destination.svc.cluster.local:8200
            - name: SOURCE_PATH
              value: shared/generated-key
            - name: DESTINATION_PATH
              value: shared/generated-key
            - name: FIELD
              value: secret_key
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  # Restrict the JWT audience so it cannot be reused as a
                  # generic Kubernetes API credential.
                  path: token
                  audience: vault
                  expirationSeconds: 600
